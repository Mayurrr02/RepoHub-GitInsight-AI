global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "repohub-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]
        labels:
          app: "repohub"
          environment: "production"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
